<section id="contact">

    <h2>Get In Touch</h2>

    <p>
        Have an opportunity, project idea or just want to connect?
        Feel free to reach out.
    </p>

    <!-- Contact Information -->
    <div class="contact-info">

        <h3>Contact Information</h3>

        <p>
            Email:
            <a href="mailto:YOUR_EMAIL">mokshithrao310@gmail.com</a>
        </p>

        <p>
            LinkedIn:
            <a href="https://www.linkedin.com/in/kv-mokshith/" target="_blank">
                LinkedIn Profile
            </a>
        </p>

        <p>
            GitHub:
            <a href="https://github.com/MokshithRao" target="_blank">
                GitHub Profile
            </a>
        </p>

    </div>


    <!-- Contact Form -->
    <div class="contact-form">

        <h3>Send Me a Message</h3>

        <form action="/contact" method="POST">

            <div>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>
            </div>

            <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit">Send Message</button>

        </form>

    </div>

</section>
